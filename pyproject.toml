[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookagain-ml"
version = "1.0.0"
description = "Leakage-aware image representation analysis for applied researchers"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Authorship withheld during double-blind review" }]
keywords = ["machine-learning", "computer-vision", "applied-research", "representation-learning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "torchvision>=0.15",
  "Pillow>=10.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
modern = [
  "transformers>=4.49",
  "huggingface-hub>=0.28",
  "safetensors>=0.4",
]
test = ["pytest>=8.0", "build>=1.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lookagain_ml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "torch: tests requiring the PyTorch/torchvision runtime",
  "real_encoder: tests requiring a published checkpoint and network/cache access",
]
